name: Bug report
description: Report a reproducible bug in JSONLoom
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for us to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include input JSON/pipeline snippets if relevant.
      placeholder: |
        1. Go to ...
        2. Configure ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Footer version, git commit, or release tag.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS (for example, Chrome 124 on macOS 15).
